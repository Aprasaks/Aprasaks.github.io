<!doctype html>
<html lang="ko" data-resolution="landscape" data-composition-variables='[{"id":"url","type":"string","label":"URL","default":"studio.dechive.dev"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/film-brain.js"></script>
    <style>
      @font-face { font-family: "Plex KR"; font-weight: 400; src: url(assets/fonts/ibm-plex-sans-kr-korean-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Plex KR"; font-weight: 400; src: url(assets/fonts/ibm-plex-sans-kr-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Plex KR"; font-weight: 600; src: url(assets/fonts/ibm-plex-sans-kr-korean-600-normal.woff2) format("woff2"); }
      @font-face { font-family: "Plex KR"; font-weight: 600; src: url(assets/fonts/ibm-plex-sans-kr-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Plex KR"; font-weight: 700; src: url(assets/fonts/ibm-plex-sans-kr-korean-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Plex KR"; font-weight: 700; src: url(assets/fonts/ibm-plex-sans-kr-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Plex Mono"; font-weight: 400; src: url(assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
      :root {
        --ground: #F2F3F0;
        --ink: #15181C;
        --muted: #5B626C;
        --accent: #2448D8;
        --font-display: "Plex KR", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 100%; height: 100%;
        font-family: var(--font-display); color: var(--ink); word-break: keep-all;
      }
      .clip { position: absolute; inset: 0; }
      #brain { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .tb { position: absolute; left:140px; top:50%; transform:translateY(-50%); width:760px; }
      .num { display: block; font-family: "Plex Mono", monospace; font-size: 38px; color: var(--accent); margin-bottom: 18px; }
      .num i { font-style: normal; color: var(--muted); }
      .title { font-size: 112px; line-height: 1.12; font-weight: 600; letter-spacing: -0.035em; }
      .hook { font-size: 103px; }
      .line { margin-top: 26px; font-size: 38px; line-height: 1.5; color: var(--muted); font-weight: 400; }
      #end .tb { left:140px; top:50%; transform:translateY(-50%); }
      .wm { font-size: 39px; font-weight: 700; letter-spacing: .16em; }
      .end-title { margin-top: 22px; font-size: 96px; line-height: 1.14; font-weight: 600; letter-spacing: -0.035em; }
      .url { margin-top: 34px; font-family: "Plex Mono", monospace; font-size: 38px; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1920" data-height="1080">
      <canvas id="brain" class="clip" width="1920" height="1080" data-start="0" data-duration="22" data-track-index="0"></canvas>
      <div id="s0" class="clip scene" data-start="0" data-duration="4.2" data-track-index="1">
        <div class="tb"><h2 class="title hook">같은 실수를,<br>왜 또 반복할까?</h2></div>
      </div>
      <div id="s1" class="clip scene" data-start="4.2" data-duration="4.0" data-track-index="1">
        <div class="tb"><span class="num">1<i>/4</i></span><h2 class="title">관찰한다</h2><p class="line">해석을 보태기 전에, 사실부터 적습니다.</p></div>
      </div>
      <div id="s2" class="clip scene" data-start="8.2" data-duration="3.3" data-track-index="1">
        <div class="tb"><span class="num">2<i>/4</i></span><h2 class="title">의심한다</h2><p class="line">당연하던 전제를 다시 묻습니다.</p></div>
      </div>
      <div id="s3" class="clip scene" data-start="11.5" data-duration="4.1" data-track-index="1">
        <div class="tb"><span class="num">3<i>/4</i></span><h2 class="title">재설계한다</h2><p class="line">의지 대신 순서와 기준을 다시 짭니다.</p></div>
      </div>
      <div id="s4" class="clip scene" data-start="15.6" data-duration="3.0" data-track-index="1">
        <div class="tb"><span class="num">4<i>/4</i></span><h2 class="title">검증한다</h2><p class="line">달라졌는지, 실제 결과로 확인합니다.</p></div>
      </div>
      <div id="end" class="clip scene" data-start="18.8" data-duration="3.2" data-track-index="1">
        <div class="tb"><p class="wm">DECHIVE</p><h2 class="end-title">생각을<br>다시 설계하는 수업</h2><p class="url" id="url">studio.dechive.dev</p></div>
      </div>
    </div>
    <script>
      (function () {
        var DUR = 22;
        var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        if (vars.url) document.getElementById('url').textContent = vars.url;

        var brain = new FilmBrain(document.getElementById('brain'), { cx: 1305.6, cy: 540.0, scale: 399.6 });
        function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
        function ez(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
        function seg(t, a, b) { return ez(c01((t - a) / (b - a))); }
        // 화면 상태는 모두 시간 t만으로 계산합니다.
        function render(t) {
          brain.draw({
            t: t,
            phase: seg(t, 11.6, 13.3) + seg(t, 13.5, 15.3),
            mark: seg(t, 4.5, 6.8),
            doubt: seg(t, 8.5, 9.9),
            scan: c01((t - 15.9) / 2.1),
            fade: 1 - 0.78 * seg(t, 18.5, 19.6)
          });
        }
        var clock = {}, now = 0;
        Object.defineProperty(clock, 't', {
          get: function () { return now; },
          set: function (v) { now = v; render(v); }
        });

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
        tl.to("#s0 .tb > *", {opacity:0, y:-16, duration:0.45, ease:"power2.in", stagger:0.05}, 3.6500000000000004);
        tl.fromTo("#s1 .tb > *", {opacity:0, y:28}, {opacity:1, y:0, duration:0.7, ease:"power3.out", stagger:0.12}, 4.25);
        tl.to("#s1 .tb > *", {opacity:0, y:-16, duration:0.45, ease:"power2.in", stagger:0.05}, 7.6499999999999995);
        tl.fromTo("#s2 .tb > *", {opacity:0, y:28}, {opacity:1, y:0, duration:0.7, ease:"power3.out", stagger:0.12}, 8.25);
        tl.to("#s2 .tb > *", {opacity:0, y:-16, duration:0.45, ease:"power2.in", stagger:0.05}, 10.95);
        tl.fromTo("#s3 .tb > *", {opacity:0, y:28}, {opacity:1, y:0, duration:0.7, ease:"power3.out", stagger:0.12}, 11.55);
        tl.to("#s3 .tb > *", {opacity:0, y:-16, duration:0.45, ease:"power2.in", stagger:0.05}, 15.049999999999999);
        tl.fromTo("#s4 .tb > *", {opacity:0, y:28}, {opacity:1, y:0, duration:0.7, ease:"power3.out", stagger:0.12}, 15.65);
        tl.to("#s4 .tb > *", {opacity:0, y:-16, duration:0.45, ease:"power2.in", stagger:0.05}, 18.05);
        tl.fromTo("#end .tb > *", {opacity:0, y:28}, {opacity:1, y:0, duration:0.8, ease:"power3.out", stagger:0.14}, 18.95);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
