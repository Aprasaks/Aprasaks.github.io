<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="DECHIVE | 생각의 재설계">

<meta property="og:image" content="https://studio.dechive.dev/assets/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/assets/architecture.webp" type="image/webp">
<link rel="stylesheet" href="/assets/landing.css">
</head>
<body>
<a class="skip-link" href="#content">본문으로 건너뛰기</a>
<div class="landing">
  <div class="photo-scene" aria-hidden="true">
    <img class="architecture" src="/assets/architecture.webp" alt="" fetchpriority="high" decoding="async">
  </div>
  <div class="light-veil" aria-hidden="true"></div>
  <div class="stone-world" aria-hidden="true">
    <div class="contact-shadow"></div>
    <div class="cube-arrival">
      <div class="stone-cube">
        <i class="face front"></i><i class="face back"></i><i class="face right"></i><i class="face left"></i><i class="face top"></i><i class="face bottom"></i>
      </div>
    </div>
  </div>
  <header class="header">
    <a href="/" class="wordmark" aria-label="DECHIVE 홈">DECHIVE</a>
    
  </header>
  <main id="content" class="content">
    <div class="statement">
      <p class="statement-small">생각의</p>
      <h1>재설계.</h1>
      <p class="statement-sub">AI시대에 익숙한 판단을 멈추고,<br>다르게 보는 힘을 만듭니다.</p>
    </div>
    <nav class="actions" aria-label="DECHIVE 참여">
      <button type="button" data-destination="consult">상담 신청</button>
      <button type="button" data-destination="newsletter">뉴스레터 구독</button>
    </nav>
  </main>
</div>
<dialog id="destination-notice" class="notice" aria-labelledby="notice-title">
  <div class="notice-panel">
    <button type="button" class="notice-close" data-close aria-label="닫기">×</button>
    <p class="notice-brand">DECHIVE</p>
    <h2 id="notice-title">연결 준비 중입니다.</h2>
    <p id="notice-copy">신청 주소를 연결하면 이곳에서 바로 이동할 수 있습니다.</p>
    <button type="button" class="notice-okay" data-close>확인</button>
  </div>
</dialog>
<script defer src="/assets/landing.js"></script>
</body>
</html>
