<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171714">
  <meta name="description" content="DECHIVE — 생각의 재설계. AI시대에 익숙한 판단을 멈추고, 다르게 보는 힘을 만듭니다.">
  <meta name="robots" content="index,follow">
  <title>DECHIVE | 생각의 재설계</title>
  <link rel="canonical" href="https://dechive.app/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="DECHIVE">
  <meta property="og:title" content="DECHIVE | 생각의 재설계">
  <meta property="og:description" content="AI시대에 익숙한 판단을 멈추고, 다르게 보는 힘을 만듭니다.">
  <meta property="og:url" content="https://dechive.app/">
  <meta property="og:image" content="https://dechive.app/assets/hero-thought.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="/assets/hero-thought.avif" as="image" type="image/avif">
  <link rel="stylesheet" href="/assets/landing.css">
  <link rel="stylesheet" href="/assets/site-header.css">
  <script src="/assets/landing.js" defer></script>
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"DECHIVE","url":"https://dechive.app/","inLanguage":"ko-KR"}</script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>

  <div class="landing">
    <picture class="backdrop" aria-hidden="true">
      <source type="image/avif" srcset="/assets/hero-thought.avif">
      <img src="/assets/hero-thought.jpg" width="1672" height="941" alt="" fetchpriority="high" decoding="async">
    </picture>
    <div class="backdrop-shade" aria-hidden="true"></div>

    <header class="site-header">
      <a class="wordmark" href="/" aria-label="DECHIVE 첫 화면">DECHIVE</a>
    </header>

    <main class="landing-main" id="main">
      <div class="hero-message">
        <h1 aria-label="생각의 재설계">
          <span class="title-prefix" aria-hidden="true">생각의</span>
          <span class="title-typed" aria-hidden="true"><span id="typed-word">재설계</span><span class="type-caret"></span></span>
        </h1>
        <p class="hero-subtitle">AI시대에 익숙한 판단을 멈추고,<br>다르게 보는 힘을 만듭니다.</p>
      </div>

      <div id="actions" class="landing-actions" aria-label="참여하기">
        <button type="button" id="records-toggle" aria-expanded="false" aria-controls="records-list">설계자의 기록</button>
        <ul id="records-list" class="records-list" aria-label="설계자의 프로젝트" hidden>
          <li>Jarvis</li>
          <li><a href="/records/wiki/" aria-label="DECHIVE.WIKI 프로젝트 소개 열기">Wiki</a></li>
          <li>Dev</li>
        </ul>
        <button type="button" data-destination="consult">상담신청</button>
        <button type="button" data-destination="newsletter">구독하기</button>
      </div>
    </main>
  </div>

  <dialog id="consult-dialog" class="consult-dialog" aria-labelledby="consult-title">
    <div class="consult-panel">
      <div class="consult-heading">
        <div class="consult-heading-copy">
          <span class="consult-brand">DECHIVE</span>
          <h2 id="consult-title">상담 신청</h2>
        </div>
        <button class="consult-close" type="button" aria-label="상담창 닫기" data-consult-close>×</button>
      </div>
      <iframe id="consult-frame" class="consult-frame" title="DECHIVE 상담 신청 Google 설문지" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="consult-footer">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdKnGWKXG0t5CmHsU1lTAHrxwjmYV69IshLvb-CDPAtdagPlw/viewform" target="_blank" rel="noopener noreferrer">양식이 보이지 않으면 새 창에서 열기</a>
      </div>
    </div>
  </dialog>

  <dialog id="newsletter-dialog" class="notice newsletter-dialog" aria-labelledby="newsletter-title">
    <div class="notice-inner">
      <button class="notice-close" type="button" data-newsletter-close aria-label="닫기">×</button>
      <p class="notice-brand">DECHIVE</p>
      <h2 id="newsletter-title">뉴스레터 구독</h2>
      <p class="newsletter-description">DECHIVE와 LETTER의 구독은 하나로 관리됩니다.</p>
      <iframe id="newsletter-frame"
        title="DECHIVE 공통 뉴스레터 구독 신청"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <p class="newsletter-privacy">구독 신청창이 보이지 않는다면
        <a href="https://letter.dechive.app/subscribe/" target="_blank" rel="noopener noreferrer">구독 신청 페이지를 새 창에서 열기</a>
      </p>
    </div>
  </dialog>
</body>
</html>
